<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link href="../../img/fav/high-temperature.png" rel="icon" type="image/png" sizes="64x64" />
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="main-container">
        <p class="temp-title">Temperature Converter</p>
        <p class="temp-subtitle">Enter the temperature, select units and submit</p>
        <div class="input-boxes-container">
            <label for="temp-decimal-input"></label>
            <input type="number" id="temp-decimal-input" class="input-box-design" placeholder="0.00" />

            <label for="from-temp-units"></label>
            <select id="from-temp-units" class="input-box-design">
                <option selected disabled value="From Unit">From Unit</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Celsius">Celsius</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <label for="to-temp-units"></label>
            <select id="to-temp-units" class="input-box-design">
                <option selected disabled value="To Unit">To Unit</option>
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Celsius">Celsius</option>
                <option value="Kelvin">Kelvin</option>
            </select>

            <button type="button" id="convert-btn" class="convert-btn">Convert</button>
        </div>

        <p class="result-text">
            <!-- 0.00 'From Unit Temperature' is 0.00 'To Unit Temperature'. -->
        </p>
    </div>

    <script src="script_2.js" type="text/javascript"></script>
</body>
</html>
