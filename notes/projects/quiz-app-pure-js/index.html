<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with Pure JavaScript</title>

    <link href="style.css" rel="stylesheet" type="text/css">

    <script type="text/javascript">
        if (localStorage.getItem("quiz-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="theme-container">
            <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
                <span class="toggle-knob"></span>
            </button>
            <span id="theme-text" class="theme-text">Theme: Light Mode</span>
        </div>

        <h3>Quiz App</h3>

        <div class="quiz-container">
            <p id="quiz-question" class="quiz-question">Questions ?</p>
            <div class="options-container">
<!--                <button class="options-btn">Option 1</button>-->
<!--                <button class="options-btn">Option 2</button>-->
<!--                <button class="options-btn">Option 3</button>-->
<!--                <button class="options-btn">Option 4</button>-->
            </div>
        </div>
    </div>
    <button type="button" id="next-btn" class="next-btn">Next</button>
    <button type="button" id="restart-btn" class="restart-btn">Restart</button>

    <script src="script.js" type="text/javascript"></script>
</body>
</html>
