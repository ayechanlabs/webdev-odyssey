<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guess</title>
    <link href="../css/l53numberguess.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="container">

        <h3>Number Guess</h3>
        <p>Guess a number between <span class="min_number">00</span> and <span class="max_number">00</span></p>

        <form id="game_form" class="game_form" action="" method="">
            <div class="form-group">
                <label for="guess_number"></label>
                <input type="number" name="guess_number" id="guess_number" class="form-control" placeholder="Enter your guess number..." autocomplete="off" autofocus />

                <input type="submit" id="submit_btn" class="submit_btn" value="Submit"/>
            </div>
        </form>

        <span class="message_1"></span>
        <span class="message_2"></span>

    </div>

    <script src="../javascript/l53numberguess.js" type="text/javascript"></script>
</body>
</html>
