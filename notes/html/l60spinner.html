<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Intro V5, Spinner</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <h3>Spinner Border</h3>
        <div class="spinner-border">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div class="spinner-border text-secondary"></div>
        <div class="spinner-border text-success"></div>
        <div class="spinner-border text-info"></div>
        <div class="spinner-border text-warning"></div>
        <div class="spinner-border text-danger"></div>
        <div class="spinner-border text-light"></div>
        <div class="spinner-border spinner-border-sm text-dark"></div>

        <hr/>

        <h3>Spinner Grow</h3>

        <div class="spinner-grow">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div class="spinner-grow text-secondary"></div>
        <div class="spinner-grow text-success"></div>
        <div class="spinner-grow text-info"></div>
        <div class="spinner-grow text-warning"></div>
        <div class="spinner-grow text-danger"></div>
        <div class="spinner-grow text-light"></div>
        <div class="spinner-grow spinner-grow-sm text-dark"></div>
    </div>

    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
