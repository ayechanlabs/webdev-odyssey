<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Image to PDF Export</title>

        <link href="../css/l55imgtopdfexport.css" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <div class="container">
            <img src="../img/icon/upload.png" id="display" class="display" alt="display-upload-img" />
            <div class="btn_container">
                <label for="file_input" class="upload_btn">
                    Upload Image
                    <input type="file" name="file_input" id="file_input" class="file_input" accept=".png, .jpg, .jpeg" />
                </label>

                <button class="download_btn" onclick="pdfloader()">Download PDF</button>
            </div>
        </div>

        <script src="../libs/jspdf/dist/jspdf.umd.min.js" type="text/javascript"></script>
        <script src="../javascript/l55imgtopdfexport.js" type="text/javascript"></script>
    </body>
</html>
