<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro V5, Responsive Container</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div>
        <h1>Without Container</h1>
        <hr/>
    </div>

    <div class="container">
        <h1>With Container</h1>
        <hr/>
    </div>

    <div class="container-fluid">
        <h1>With Container Fluid</h1>
        <hr/>
    </div>

    <hr/>

    <div class="container-xxl">This is xxl container work for xxl size.</div>
    <div class="container-xl">This is xl container work for xl size.</div>
    <div class="container-lg">This is lg container work for lg size.</div>
    <div class="container-md">This is md container work for md size.</div>
    <div class="container-sm">This is sm container work for sm size.</div>
    <div class="container">This is fixed container.</div>

    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
