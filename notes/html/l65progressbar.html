<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro V5, Progress Bar</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="container">
        <h3>Progress Bar</h3>

        <div class="progress">
            <div class="progress-bar bg-danger" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <br/>

        <div class="progress">
            <div class="progress-bar bg-success" style="width: 50%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <br/>

        <div class="progress">
            <div class="progress-bar bg-primary" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <hr/>

        <h3>Progress Bar with Value, Striped, Animated</h3>

        <div class="progress">
            <div class="progress-bar bg-info" style="width: 50%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">50%</div>
        </div>
        
        <br/>

        <div class="progress">
            <div class="progress-bar progress-bar-striped bg-warning" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
        </div>

        <br/>

        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 90%;" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">90%</div>
        </div>

        <hr/>

        <h3>Multi Progress Bar (progress-stacked) / Height</h3>

        <div class="progress-stacked" style="height: 15px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">10</div>
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">20</div>
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 40%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">40</div>
        </div>

    </div>   
    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
