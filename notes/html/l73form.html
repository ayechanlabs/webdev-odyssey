<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro V5, Form</title>

    <!-- bootstrap css1 js1 -->
    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" type="text/css" />

</head>
<body>
    <div class="container">
        <h1>Bootstrap Form Element</h1>

        <form action="" method="" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first-name" id="first-name" class="form-control" placeholder="Enter your First Name" />
                </div>
                <div class="col-md-6 mb-3">
                    <label for="last-name">Last Name</label>
                    <input type="text" name="last-name" id="last-name" class="form-control" placeholder="Enter your Last Name" />
                </div>
                <div class="col-md-6 mb-3">
                    <label for="age">Age</label>
                    <input type="number" name="age" id="age" class="form-control" placeholder="Enter your Age" />
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email">Age</label>
                    <input type="number" name="age" id="age" class="form-control" placeholder="Enter your Age" />
                </div>
            </div>
        </form>

    </div>

    <!-- bootstrap css1 js1 -->
    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
    
    <!-- jquery js1 -->
    <script src="../libs/jquery-4.0.0.js" type="text/javascript"></script>
</body>
</html>
