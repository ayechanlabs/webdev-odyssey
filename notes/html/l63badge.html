<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Intro V5, Badge</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h3>Badge</h3>

        <button type="button" class="btn btn-primary rounded-0">
            Notification
            <span class="badge text-bg-danger">5</span>
        </button>

        <hr/>

        <span class="badge text-bg-primary rounded-0">primary</span>
        <span class="badge text-bg-secondary rounded">secondary</span>
        <span class="badge text-bg-success rounded-pill">success</span>
        <span class="badge text-bg-info">info</span>
        <span class="badge text-bg-warning">warning</span>
        <span class="badge text-bg-danger">danger</span>
        <span class="badge text-bg-light">light</span>
        <span class="badge text-bg-dark">dark</span>

        <hr/>

        <!--
        sup = super-script
        sub = sub-script
        -->

        <b>x</b><sup class="badge text-bg-primary">2</sup>

        <br/>

        <b>H</b><sub class="badge text-bg-primary">2</sub><b>O</b>

    </div>

    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
