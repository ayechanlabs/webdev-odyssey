<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Intro V5, Button</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h3>Button</h3>

        <button type="button" class="btn btn-primary">Hello Primary Color</button>
        <button type="button" class="btn btn-secondary">Hello Secondary Color</button>
        <button type="button" class="btn btn-success">Hello Success Color</button>
        <button type="button" class="btn btn-info">Hello Info Color</button>
        <button type="button" class="btn btn-warning">Hello Warning Color</button>
        <button type="button" class="btn btn-danger">Hello Danger Color</button>
        <button type="button" class="btn btn-light">Hello Light Color</button>
        <button type="button" class="btn btn-dark">Hello Dark Color</button>

        <hr/>

        <h3>Button Outline</h3>

        <button type="button" class="btn btn-outline-primary">Hello Primary Outline Color</button>
        <button type="button" class="btn btn-outline-secondary">Hello Secondary Outline Color</button>
        <button type="button" class="btn btn-outline-success">Hello Success Outline Color</button>
        <button type="button" class="btn btn-outline-info">Hello Info Outline Color</button>
        <button type="button" class="btn btn-outline-warning">Hello Warning Outline Color</button>
        <button type="button" class="btn btn-outline-danger">Hello Danger Outline Color</button>
        <button type="button" class="btn btn-outline-light">Hello Light Outline Color</button>
        <button type="button" class="btn btn-outline-dark disabled">Hello Dark Outline Color</button>

        <hr/>

        <h3>Link Button</h3>

        <!-- button ကို သုံးပြီ link လုပ်လို့ ရသလို -->
        <button type="button" class="btn btn-link">Hello Link</button>
        <!-- link ကို သုံးပြီ လည်း button လုပ်လို့ ရတယ်။-->
        <a href="javascript:void(0)" class="btn btn-primary">Link One</a>
        <a href="https://google.com" class="btn btn-secondary">Link Two</a>
        <a href="https://google.com" class="btn btn-success disabled">Link Three</a>

        <hr/>

        <h3>Button Size</h3>

        <button type="button" class="btn btn-primary btn-lg">Button Large</button>
        <button type="button" class="btn btn-secondary btn-md">Button Medium</button>
        <button type="button" class="btn btn-success btn-sm">Button Small</button>

        <hr/>

        <div class="d-grid">
            <button type="button" class="btn btn-primary rounded-0">Submit</button>
        </div>

        <hr/>

        <h3>Button Group</h3>

        <div class="btn-group">
            <button type="button" class="btn btn-danger">Left</button>
            <button type="button" class="btn btn-success">Center</button>
            <button type="button" class="btn btn-primary">Right</button>
        </div>

        <div class="btn-group-vertical">
            <button type="button" class="btn btn-danger">Top</button>
            <button type="button" class="btn btn-success">Middle</button>
            <button type="button" class="btn btn-primary">Bottom</button>
        </div>

        <hr/>

        <button type="button" class="btn btn-primary" disabled>
            <span class="spinner-border spinner-border-sm"></span>
            <span>Loading...</span>
        </button>

        <button type="button" class="btn btn-primary" disabled>
            <span class="spinner-grow spinner-grow-sm"></span>
            <span>Loading...</span>
        </button>
    </div>

    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
