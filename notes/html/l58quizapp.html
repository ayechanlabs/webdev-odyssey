<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Quiz App</title>

    <link href="../css/l58quizapp.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        <button type="button" id="theme-toggle" class="theme-toggle">Theme</button>

        <h3>Quiz App</h3>

        <div id="quiz-container">
            <p id="question">Question for a quiz?</p>
            <div class="options">
                <button type="button" class="option-btn">Sample Option 1</button>
                <button type="button" class="option-btn">Sample Option 2</button>
                <button type="button" class="option-btn">Sample Option 3</button>
                <button type="button" class="option-btn">Sample Option 4</button>
            </div>
        </div>

        <button type="button" class="next-btn">Next</button>

        <div id="result">
            <h3>Your Score: 0/3</h3>
            <button type="button" id="restart-btn">Restart</button>
        </div>
    </div>

    <script src="../libs/jquery-4.0.0.js" type="text/javascript"></script>
    <script src="../javascript/l58quizapp.js" type="text/javascript"></script>
</body>
</html>
