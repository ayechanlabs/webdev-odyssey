<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Intro V5, Pagination</title>

    <link href="../libs/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="container">
        <h3>Pagination</h3>

        <!-- pagination မှာ d-flex (display: flex) သုံးစရာ မလိုဘူး အစထဲက ပါပြီသာဖြစ်တဲ့ အတွက်ကြောင့် မို့လို့။ -->
        <nav>
            <ul class="pagination">
                <li class="page-item disabled"><a href="javascript:void(0);" class="page-link">Previous</a></li>
                <li class="page-item active"><a href="javascript:void(0);" class="page-link ">1</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">2</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">3</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">4</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">5</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">6</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">7</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">Next</a></li>
            </ul>
        </nav>

        <nav>
            <ul class="pagination pagination-lg justify-content-center">
                <li class="page-item disabled"><a href="javascript:void(0);" class="page-link">Previous</a></li>
                <li class="page-item active"><a href="javascript:void(0);" class="page-link ">1</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">2</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">3</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">4</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">5</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">6</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">7</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">Next</a></li>
            </ul>
        </nav>

        <nav>
            <ul class="pagination pagination-sm justify-content-end">
                <li class="page-item disabled"><a href="javascript:void(0);" class="page-link">Previous</a></li>
                <li class="page-item active"><a href="javascript:void(0);" class="page-link ">1</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">2</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">3</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">4</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">5</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">6</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">7</a></li>
                <li class="page-item"><a href="javascript:void(0);" class="page-link">Next</a></li>
            </ul>
        </nav>
    </div>

    <script src="../libs/bootstrap-5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>
</html>
