<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML & CSS Exercise 9G</title>

        <link href="9g.css" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <div class="pf-container">

                <p class="pf-mutual-friend">3 mutual friends</p>
                <button type="button" class="add-friend-btn">Add Friend</button>
            </div>
        </div>

        <div class="pf-container">
            <img src="../../img/exercise_img/dog.jpg" alt="dog-image" class="pf-img" />
            <div class="pf-details">
                <p class="pf-name">Rex</p>
                <p class="pf-mutual-friend">4 mutual friends</p>
                <button type="button" class="add-friend-btn">Add Friend</button>
            </div>
